# ==========================================
# YOURDASHBOARD - DOCKER COMPOSE
# Compatible con nuevos Dockerfiles multi-stage
# ==========================================

services:
  # ================================
  # INFRAESTRUCTURA
  # ================================
  
  # PostgreSQL 17 - Base de datos principal
  postgres:
    image: postgres:17-alpine
    container_name: yourdashboard-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-ms_yourdashboard_auth}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --lc-collate=C --lc-ctype=C"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./ms-yourdashboard-auth/src/database/migration_scripts:/migration_scripts
      - ./ms-yourdashboard-auth/src/database/migration_scripts/00_master.sql:/docker-entrypoint-initdb.d/00_init.sql
    networks:
      - yourdashboard-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-ms_yourdashboard_auth}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    security_opt:
      - no-new-privileges:true

  # Redis 7.4 - Cache y sesiones
  redis:
    image: redis:7.4-alpine
    container_name: yourdashboard-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: >
      redis-server
      --appendonly yes
      --appendfsync everysec
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    networks:
      - yourdashboard-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    security_opt:
      - no-new-privileges:true

  # ================================
  # MICROSERVICIOS BACKEND
  # ================================

  # MS-Auth - Autenticación JWT y OAuth
  ms-auth:
    build:
      context: ./ms-yourdashboard-auth
      dockerfile: Dockerfile
      args:
        NODE_ENV: production
    container_name: yourdashboard-ms-auth
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      NODE_ENV: production
      PORT: 3001
      DATABASE_URL: postgresql://${DB_USER:-postgres}:${DB_PASSWORD}@postgres:5432/${DB_NAME:-ms_yourdashboard_auth}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-24h}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - yourdashboard-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/auth/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    security_opt:
      - no-new-privileges:true

  # MS-Email - Gestión de emails Gmail API
  ms-email:
    build:
      context: ./ms-yourdashboard-email
      dockerfile: Dockerfile
      args:
        NODE_ENV: production
    container_name: yourdashboard-ms-email
    restart: unless-stopped
    ports:
      - "3002:3002"
    environment:
      NODE_ENV: production
      PORT: 3002
      DATABASE_URL: postgresql://${DB_USER:-postgres}:${DB_PASSWORD}@postgres:5432/${DB_NAME:-ms_yourdashboard_auth}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - yourdashboard-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3002/email/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    security_opt:
      - no-new-privileges:true

  # MS-Orchestrator - BFF Coordinador
  ms-orchestrator:
    build:
      context: ./ms-yourdashboard-orchestrator
      dockerfile: Dockerfile
      args:
        NODE_ENV: production
    container_name: yourdashboard-ms-orchestrator
    restart: unless-stopped
    ports:
      - "3003:3003"
    environment:
      NODE_ENV: production
      PORT: 3003
      MS_AUTH_URL: http://ms-auth:3001
      MS_EMAIL_URL: http://ms-email:3002
      FRONTEND_URL: http://frontend:3000
      ORCHESTRATOR_URL: http://localhost:3003
      REDIS_URL: redis://redis:6379
      CACHE_TTL_EMAILS: ${CACHE_TTL_EMAILS:-300}
      CACHE_TTL_STATS: ${CACHE_TTL_STATS:-600}
      CACHE_TTL_SEARCH: ${CACHE_TTL_SEARCH:-180}
    depends_on:
      redis:
        condition: service_healthy
      ms-auth:
        condition: service_started
      ms-email:
        condition: service_started
    networks:
      - yourdashboard-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3003/orchestrator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    security_opt:
      - no-new-privileges:true

  # ================================
  # FRONTEND
  # ================================

  # Frontend Next.js
  frontend:
    build:
      context: ./fe-yourdashboard
      dockerfile: Dockerfile
      args:
        NODE_ENV: production
    container_name: yourdashboard-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      NEXT_PUBLIC_MS_AUTH_URL: http://localhost:3001
      NEXT_PUBLIC_MS_ORCHESTRATOR_URL: http://localhost:3003
    depends_on:
      - ms-orchestrator
    networks:
      - yourdashboard-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    security_opt:
      - no-new-privileges:true

# ================================
# VOLÚMENES PERSISTENTES
# ================================
volumes:
  postgres_data:
    driver: local
    name: yourdashboard_postgres_data
  redis_data:
    driver: local
    name: yourdashboard_redis_data

# ================================
# REDES
# ================================
networks:
  yourdashboard-network:
    driver: bridge
    name: yourdashboard_network